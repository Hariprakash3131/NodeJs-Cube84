<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Nexora | Premium Indian E-Commerce Shopping Experience</title>
  <meta name="description" content="Discover premium electronics, authentic fashion, smartphones and home appliances with Nexora Assured quality, same-day delivery, and bank-grade secure checkout.">
  
  <!-- Inter Font Fallback and Typography Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/main.css">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231e40af'><rect width='24' height='24' rx='6' fill='%231e40af'/><text x='12' y='17' font-size='14' font-weight='bold' fill='%23fbbf24' text-anchor='middle'>N</text></svg>">
</head>
<body>
  <!-- WCAG Accessibility: Skip Link -->
  <a href="#app-root" class="skip-link">Skip to main content</a>

  <!-- Header Slot (Sticky) -->
  <div id="header-slot"></div>

  <!-- Mega Menu Navigation Bar Slot -->
  <div id="mega-menu-slot"></div>

  <!-- Main View Slot -->
  <main id="app-root" role="main" tabindex="-1"></main>

  <!-- Footer Slot -->
  <div id="footer-slot"></div>

  <!-- Accessible Floating Toast Container -->
  <aside class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></aside>

  <!-- Modal Dialog Overlay Container -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" onclick="if(event.target === this) window.appModals.closeModal();">
    <div class="modal-dialog" id="modal-dialog-content"></div>
  </div>

  <!-- Mobile Bottom Navigation Bar (Flipkart / Myntra Mobile Pattern) -->
  <nav class="mobile-bottom-nav" aria-label="Mobile Navigation">
    <button class="mobile-nav-btn active" data-nav-target="home" onclick="window.appRouter.navigate('home')" aria-label="Home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span>Home</span>
    </button>
    <button class="mobile-nav-btn" data-nav-target="category" onclick="window.appRouter.navigate('category', { category: 'all' })" aria-label="Categories">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      <span>Categories</span>
    </button>
    <button class="mobile-nav-btn" data-nav-target="dashboard" onclick="window.appRouter.navigate('dashboard')" aria-label="Account">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span>Account</span>
    </button>
    <button class="mobile-nav-btn" data-nav-target="cart" onclick="window.appRouter.navigate('cart')" aria-label="Cart">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
      <span>Cart</span>
    </button>
  </nav>

  <!-- ES6 Modular Application Controller -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
