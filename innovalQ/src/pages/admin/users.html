<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <!-- @include partials/meta-head.html title="Users & Client Management — Servora Admin" description="Manage team members, client collaborators, roles, and access credentials." -->
</head>
<body class="bg-slate-50 dark:bg-[#080c14] text-slate-800 dark:text-slate-100 antialiased selection:bg-primary-500 selection:text-white"
      x-data="{ 
        sidebarOpen: false, 
        addUserModal: false,
        searchQuery: '',
        roleFilter: 'all',
        users: [
          { id: 1, name: 'Sarah Jenkins', email: 'sarah@servora.io', role: 'Executive Lead', status: 'Active', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=80&q=80', lastActive: '2 mins ago' },
          { id: 2, name: 'David Chen', email: 'david@servora.io', role: 'Principal Architect', status: 'Active', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=80&q=80', lastActive: '14 mins ago' },
          { id: 3, name: 'Elena Rostova', email: 'elena@velocepay.com', role: 'Client Executive', status: 'Active', avatar: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=80&q=80', lastActive: '1 hr ago' },
          { id: 4, name: 'Liam O\'Connor', email: 'liam@servora.io', role: 'VP Cybersecurity', status: 'Active', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=80&q=80', lastActive: '3 hrs ago' },
          { id: 5, name: 'Marcus Vance', email: 'marcus@aether.io', role: 'Client Developer', status: 'Pending Invite', avatar: 'https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=80&q=80', lastActive: 'Invited' },
          { id: 6, name: 'Amira Al-Mansoor', email: 'amira@servora.io', role: 'Design Lead', status: 'Active', avatar: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=80&q=80', lastActive: 'Yesterday' }
        ],
        filteredUsers() {
          return this.users.filter(u => {
            const matchRole = this.roleFilter === 'all' || u.role.toLowerCase().includes(this.roleFilter.toLowerCase());
            const matchSearch = u.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                                u.email.toLowerCase().includes(this.searchQuery.toLowerCase());
            return matchRole && matchSearch;
          });
        }
      }">

  <!-- Sidebar -->
  <!-- @include partials/admin-sidebar.html active_users="bg-primary-50 dark:bg-primary-950 text-primary-600 dark:text-primary-400 font-bold" -->

  <div class="lg:ps-64 flex flex-col min-h-screen">
    
    <!-- Top Header -->
    <!-- @include partials/admin-header.html -->

    <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-6 text-start">
      
      <!-- Page Title & Actions -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold font-display text-slate-900 dark:text-white">
            Users & Collaborators
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
            Manage organization team members, role assignments, and external client guests.
          </p>
        </div>

        <button type="button" 
                @click="addUserModal = true" 
                class="btn-primary text-xs py-2.5 px-4 shadow-sm flex items-center gap-1.5 self-start sm:self-auto">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          <span>Add New Member</span>
        </button>
      </div>

      <!-- Filter Toolbar -->
      <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="relative w-full sm:w-80">
          <input type="text" 
                 x-model="searchQuery" 
                 placeholder="Search by name or email..." 
                 class="form-input text-xs ps-9 py-2" />
          <svg class="w-4 h-4 absolute start-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>

        <div class="flex items-center gap-3 w-full sm:w-auto">
          <select x-model="roleFilter" class="form-input text-xs py-2 w-full sm:w-44">
            <option value="all">All Roles</option>
            <option value="Executive">Executive</option>
            <option value="Architect">Architect</option>
            <option value="Client">Client Guests</option>
            <option value="Design">Designers</option>
          </select>
        </div>
      </div>

      <!-- Users Data Table Card -->
      <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-xs text-start border-collapse">
            <thead>
              <tr class="bg-slate-50/70 dark:bg-slate-800/40 border-b border-slate-200/80 dark:border-slate-800 text-slate-400 font-bold uppercase tracking-wider text-[10px]">
                <th class="py-3 px-4 text-start">Member</th>
                <th class="py-3 px-4 text-start">Role</th>
                <th class="py-3 px-4 text-start">Status</th>
                <th class="py-3 px-4 text-start">Last Active</th>
                <th class="py-3 px-4 text-end">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-slate-800 text-slate-700 dark:text-slate-300">
              <template x-for="user in filteredUsers()" :key="user.id">
                <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition-colors">
                  <td class="py-3.5 px-4">
                    <div class="flex items-center gap-3">
                      <img :src="user.avatar" :alt="user.name" class="w-8 h-8 rounded-full object-cover ring-2 ring-primary-500/20" />
                      <div>
                        <p class="font-bold text-slate-900 dark:text-white" x-text="user.name"></p>
                        <p class="text-[11px] text-slate-400" x-text="user.email"></p>
                      </div>
                    </div>
                  </td>
                  <td class="py-3.5 px-4 font-semibold text-slate-800 dark:text-slate-200" x-text="user.role"></td>
                  <td class="py-3.5 px-4">
                    <span :class="user.status === 'Active' ? 'badge-success' : 'badge-warning'" x-text="user.status"></span>
                  </td>
                  <td class="py-3.5 px-4 text-slate-400" x-text="user.lastActive"></td>
                  <td class="py-3.5 px-4 text-end">
                    <button type="button" @click="alert('Edit member: ' + user.name)" class="p-1 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200" aria-label="Edit Member">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                    </button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- Table Footer / Pagination -->
        <div class="p-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs text-slate-400">
          <span>Showing <span class="font-bold text-slate-700 dark:text-slate-200" x-text="filteredUsers().length"></span> members</span>
          <div class="flex items-center gap-1">
            <button class="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100">Prev</button>
            <button class="px-2.5 py-1 rounded-lg bg-primary-600 text-white font-bold">1</button>
            <button class="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100">Next</button>
          </div>
        </div>

      </div>

    </main>

    <footer class="p-6 text-center text-xs text-slate-400 border-t border-slate-200 dark:border-slate-800">
      &copy; 2026 Servora Enterprise Control Plane.
    </footer>

  </div>

  <!-- Add User Modal -->
  <div x-show="addUserModal" 
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
       style="display: none;">
    <div @click.away="addUserModal = false" class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 max-w-md w-full border border-slate-200 dark:border-slate-800 shadow-2xl text-start">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-slate-900 dark:text-white">Invite Team Member</h3>
        <button @click="addUserModal = false" class="text-slate-400 hover:text-slate-600" aria-label="Close add member modal">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <form class="space-y-4" onsubmit="event.preventDefault(); alert('Invitation token dispatched!'); addUserModal = false;">
        <div>
          <label class="form-label text-xs">Full Name</label>
          <input type="text" required placeholder="Elena Rostova" class="form-input text-xs" />
        </div>
        <div>
          <label class="form-label text-xs">Work Email</label>
          <input type="email" required placeholder="elena@company.com" class="form-input text-xs" />
        </div>
        <div>
          <label class="form-label text-xs">Permission Role</label>
          <select class="form-input text-xs">
            <option>Principal Architect</option>
            <option>Senior Full-Stack Engineer</option>
            <option>Client Guest (Read-Only Sprints)</option>
            <option>Organization Billing Admin</option>
          </select>
        </div>
        <div class="pt-2 flex justify-end gap-2">
          <button type="button" @click="addUserModal = false" class="btn-secondary text-xs py-2 px-4">Cancel</button>
          <button type="submit" class="btn-primary text-xs py-2 px-5">Send Invitation</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Floating Customizer Demo Panel -->
  <!-- @include partials/demo-panel.html -->

    <script defer src="{{root}}js/animations.bundle.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.initAnimations) window.initAnimations();
    });
  </script>

</body>
</html>
