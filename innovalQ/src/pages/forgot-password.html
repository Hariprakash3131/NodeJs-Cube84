<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <!-- @include partials/meta-head.html title="Reset Your Password" description="Request a secure password reset link for your Servora account." -->
</head>
<body class="bg-white dark:bg-[#080c14] text-slate-800 dark:text-slate-100 antialiased selection:bg-primary-500 selection:text-white">

  <main id="main-content" class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    <div class="glow-orb w-96 h-96 bg-primary-500/10 top-1/4 start-1/2 -translate-x-1/2"></div>

    <div class="max-w-md w-full bg-white dark:bg-slate-900 p-8 sm:p-10 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-2xl relative z-10 text-start"
         x-data="{ sent: false, email: '' }">
      
      <!-- Brand Logo -->
      <a href="/index.html" class="flex items-center gap-2 mb-8 focus-visible:ring-2 focus-visible:ring-primary-500 rounded-lg w-fit">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-primary-600 to-secondary-500 flex items-center justify-center text-white shadow-md">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2" stroke-width="2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        </div>
        <span class="text-xl font-extrabold text-slate-900 dark:text-white font-display">Servora<span class="text-primary-500">.</span></span>
      </a>

      <!-- State: Form -->
      <div x-show="!sent">
        <h1 class="text-2xl font-bold font-display text-slate-900 dark:text-white mb-2">Reset Password</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mb-6">
          Enter your registered work email and we will send you a cryptographically signed recovery token.
        </p>

        <form class="space-y-4" @submit.prevent="sent = true">
          <div>
            <label class="form-label text-xs">Work Email</label>
            <input type="email" x-model="email" required placeholder="alex@company.com" class="form-input text-xs" />
          </div>

          <button type="submit" class="btn-primary w-full text-xs py-3">
            Send Reset Instructions &rarr;
          </button>
        </form>
      </div>

      <!-- State: Success -->
      <div x-show="sent" class="text-center py-4">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center mx-auto mb-4 font-bold text-xl">
          ✓
        </div>
        <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Check Your Inbox</h2>
        <p class="text-xs text-slate-500 leading-relaxed mb-6">
          If an account exists for <span class="font-bold text-slate-800 dark:text-slate-200" x-text="email"></span>, an authentication recovery link has been dispatched.
        </p>
        <button type="button" @click="sent = false" class="btn-secondary text-xs w-full py-2">
          Try Different Email
        </button>
      </div>

      <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 text-center text-xs">
        <a href="/login.html" class="font-bold text-primary-600 dark:text-primary-400 hover:underline flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5 rtl-mirror" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          <span>Return to Sign In</span>
        </a>
      </div>

    </div>
  </main>

    <script defer src="{{root}}js/animations.bundle.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.initAnimations) window.initAnimations();
    });
  </script>

</body>
</html>
