<!-- Admin Dashboard Sidebar -->
<!-- Mobile Overlay -->
<div x-cloak
     x-show="sidebarOpen" 
     @click="sidebarOpen = false" 
     x-transition:enter="transition-opacity ease-linear duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition-opacity ease-linear duration-300"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm lg:hidden"></div>

<!-- Sidebar Drawer -->
<aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
       class="fixed top-0 start-0 z-50 h-screen w-64 bg-white dark:bg-slate-900 border-e border-slate-200 dark:border-slate-800 flex flex-col transition-transform duration-300 ease-in-out">
  
  <!-- Sidebar Header / Brand -->
  <div class="h-16 flex items-center justify-between px-6 border-b border-slate-100 dark:border-slate-800">
    <a href="{{root}}admin/dashboard.html" class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-primary-600 to-secondary-500 flex items-center justify-center text-white shadow-md">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <polygon points="12 2 2 7 12 12 22 7 12 2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="2 17 12 22 22 17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <span class="text-lg font-extrabold text-slate-900 dark:text-white font-display">Servora</span>
        <span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-primary-50 dark:bg-primary-950 text-primary-600 dark:text-primary-400 ms-1">Admin</span>
      </div>
    </a>
    
    <!-- Close on mobile -->
    <button @click="sidebarOpen = false" class="lg:hidden p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" aria-label="Close Navigation Sidebar">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>

  <!-- Navigation Links -->
  <div class="flex-1 overflow-y-auto px-4 py-5 space-y-6">
    
    <!-- Core Management -->
    <div>
      <span class="block px-3 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-2">Management</span>
      <nav class="space-y-1">
        
        <!-- Dashboard -->
        <a href="{{root}}admin/dashboard.html" 
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all group {{active_dashboard}}">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          <span>Dashboard</span>
        </a>

        <!-- Users -->
        <a href="{{root}}admin/users.html" 
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all group {{active_users}}">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <span>Users & Clients</span>
          <span class="ms-auto text-xs px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-bold">148</span>
        </a>

        <!-- Orders -->
        <a href="{{root}}admin/orders.html" 
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all group {{active_orders}}">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
          <span>Orders & Pipeline</span>
          <span class="ms-auto text-xs px-2 py-0.5 rounded-full bg-primary-50 dark:bg-primary-950 text-primary-600 dark:text-primary-400 font-bold">12 new</span>
        </a>

        <!-- Messages -->
        <a href="{{root}}admin/messages.html" 
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all group {{active_messages}}">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span>Inbox & Messages</span>
          <span class="ms-auto w-2 h-2 rounded-full bg-emerald-500"></span>
        </a>

        <!-- Analytics -->
        <a href="{{root}}admin/analytics.html" 
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all group {{active_analytics}}">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          <span>Analytics & Funnel</span>
        </a>

      </nav>
    </div>

    <!-- Settings & Portals -->
    <div>
      <span class="block px-3 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-2">Preferences</span>
      <nav class="space-y-1">
        
        <!-- Settings -->
        <a href="{{root}}admin/settings.html" 
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all group {{active_settings}}">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span>System Settings</span>
        </a>

        <!-- Return to Public Site -->
        <a href="{{root}}index.html" 
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-400 hover:text-primary-600 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all">
          <svg class="w-5 h-5 shrink-0 rtl-mirror" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          <span>Exit to Website</span>
        </a>

      </nav>
    </div>

  </div>

  <!-- User Profile Mini Bar -->
  <div class="p-4 border-t border-slate-100 dark:border-slate-800">
    <div class="flex items-center gap-3 p-2 rounded-xl bg-slate-50 dark:bg-slate-800/60">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&h=120&q=80" 
           alt="Sarah Jenkins Avatar" 
           class="w-9 h-9 rounded-full object-cover ring-2 ring-primary-500/20" />
      <div class="flex-1 min-w-0">
        <p class="text-xs font-bold text-slate-900 dark:text-white truncate">Sarah Jenkins</p>
        <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate">VP Operations</p>
      </div>
      <a href="{{root}}login.html" title="Sign Out" class="text-slate-400 hover:text-rose-500 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </a>
    </div>
  </div>

</aside>
