<!-- Servora Floating Live Customizer Demo Panel -->
<div x-data="{ 
       open: false, 
       activeColor: localStorage.getItem('servora_color_theme') || 'default',
       isDark: document.documentElement.classList.contains('dark'),
       isRtl: document.documentElement.getAttribute('dir') === 'rtl',
       lenis: localStorage.getItem('servora_lenis') !== 'false',
       
       setColor(c) {
         this.activeColor = c;
         if (c === 'default') document.documentElement.removeAttribute('data-theme');
         else document.documentElement.setAttribute('data-theme', c);
         localStorage.setItem('servora_color_theme', c);
         window.dispatchEvent(new CustomEvent('servora:color-changed', { detail: { color: c } }));
       },

       toggleTheme() {
         this.isDark = !this.isDark;
         if (this.isDark) document.documentElement.classList.add('dark');
         else document.documentElement.classList.remove('dark');
         localStorage.setItem('servora_theme', this.isDark ? 'dark' : 'light');
         window.dispatchEvent(new CustomEvent('servora:theme-changed', { detail: { theme: this.isDark ? 'dark' : 'light' } }));
       },

       toggleRtl() {
         this.isRtl = !this.isRtl;
         const d = this.isRtl ? 'rtl' : 'ltr';
         document.documentElement.setAttribute('dir', d);
         document.documentElement.setAttribute('lang', this.isRtl ? 'ar' : 'en');
         localStorage.setItem('servora_dir', d);
         window.dispatchEvent(new CustomEvent('servora:dir-changed', { detail: { dir: d } }));
       },

       toggleSmoothScroll() {
         this.lenis = !this.lenis;
         localStorage.setItem('servora_lenis', this.lenis ? 'true' : 'false');
         if (window.Servora?.toggleLenis) window.Servora.toggleLenis(this.lenis);
       }
     }" 
     class="fixed bottom-6 end-6 z-50">

  <!-- Trigger Button -->
  <button type="button" 
          @click="open = !open" 
          class="w-13 h-13 p-3 rounded-2xl bg-gradient-to-tr from-primary-600 to-secondary-500 text-white shadow-xl shadow-primary-500/30 hover:scale-105 active:scale-95 transition-all flex items-center justify-center group"
          aria-label="Open Theme Customizer Demo Panel"
          :aria-expanded="open">
    <svg class="w-6 h-6 group-hover:rotate-90 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
    </svg>
  </button>

  <!-- Flyout Customizer Card -->
  <div x-cloak
       x-show="open" 
       @click.away="open = false" 
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 translate-y-4 scale-95"
       x-transition:enter-end="opacity-100 translate-y-0 scale-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 translate-y-0 scale-100"
       x-transition:leave-end="opacity-0 translate-y-4 scale-95"
       class="absolute bottom-16 end-0 w-80 p-5 bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200/80 dark:border-slate-800 text-slate-800 dark:text-slate-100">
    
    <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
      <div>
        <h4 class="font-bold text-sm">Theme Customizer</h4>
        <p class="text-[11px] text-slate-400">Live preview & configuration</p>
      </div>
      <button @click="open = false" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" aria-label="Close Customizer Panel">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- 1. Brand Palettes -->
    <div class="mt-4">
      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2.5">Brand Palette (5 presets)</label>
      <div class="grid grid-cols-5 gap-2">
        <!-- Indigo (Default) -->
        <button type="button" 
                @click="setColor('default')" 
                title="Indigo Palette"
                class="w-10 h-10 rounded-xl bg-indigo-600 relative flex items-center justify-center ring-offset-2 transition-all"
                :class="activeColor === 'default' ? 'ring-2 ring-indigo-600 scale-105 shadow-md' : 'opacity-80 hover:opacity-100'">
          <span x-show="activeColor === 'default'" class="text-white text-xs font-bold">✓</span>
        </button>

        <!-- Emerald -->
        <button type="button" 
                @click="setColor('emerald')" 
                title="Emerald Palette"
                class="w-10 h-10 rounded-xl bg-emerald-500 relative flex items-center justify-center ring-offset-2 transition-all"
                :class="activeColor === 'emerald' ? 'ring-2 ring-emerald-500 scale-105 shadow-md' : 'opacity-80 hover:opacity-100'">
          <span x-show="activeColor === 'emerald'" class="text-white text-xs font-bold">✓</span>
        </button>

        <!-- Ocean / Cyan -->
        <button type="button" 
                @click="setColor('ocean')" 
                title="Ocean Palette"
                class="w-10 h-10 rounded-xl bg-sky-500 relative flex items-center justify-center ring-offset-2 transition-all"
                :class="activeColor === 'ocean' ? 'ring-2 ring-sky-500 scale-105 shadow-md' : 'opacity-80 hover:opacity-100'">
          <span x-show="activeColor === 'ocean'" class="text-white text-xs font-bold">✓</span>
        </button>

        <!-- Rose / Ruby -->
        <button type="button" 
                @click="setColor('rose')" 
                title="Rose Palette"
                class="w-10 h-10 rounded-xl bg-rose-500 relative flex items-center justify-center ring-offset-2 transition-all"
                :class="activeColor === 'rose' ? 'ring-2 ring-rose-500 scale-105 shadow-md' : 'opacity-80 hover:opacity-100'">
          <span x-show="activeColor === 'rose'" class="text-white text-xs font-bold">✓</span>
        </button>

        <!-- Amber / Warm -->
        <button type="button" 
                @click="setColor('amber')" 
                title="Amber Palette"
                class="w-10 h-10 rounded-xl bg-amber-500 relative flex items-center justify-center ring-offset-2 transition-all"
                :class="activeColor === 'amber' ? 'ring-2 ring-amber-500 scale-105 shadow-md' : 'opacity-80 hover:opacity-100'">
          <span x-show="activeColor === 'amber'" class="text-white text-xs font-bold">✓</span>
        </button>
      </div>
    </div>

    <!-- 2. Dark / Light Toggle -->
    <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
      <div>
        <p class="text-xs font-semibold">Dark Mode</p>
        <p class="text-[11px] text-slate-400">Class-based dark theme</p>
      </div>
      <button type="button" 
              @click="toggleTheme()" 
              aria-label="Toggle Dark Mode Theme"
              class="w-12 h-6 rounded-full transition-colors relative p-0.5 focus:outline-none"
              :class="isDark ? 'bg-primary-600' : 'bg-slate-300'">
        <div class="w-5 h-5 rounded-full bg-white shadow-md transform transition-transform"
             :class="isDark ? 'translate-x-6' : 'translate-x-0'"></div>
      </button>
    </div>

    <!-- 3. RTL / LTR Direction Toggle -->
    <div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
      <div>
        <p class="text-xs font-semibold">RTL Direction (عربي)</p>
        <p class="text-[11px] text-slate-400">Right-to-Left layout & Cairo font</p>
      </div>
      <button type="button" 
              @click="toggleRtl()" 
              aria-label="Toggle Right to Left Direction"
              class="w-12 h-6 rounded-full transition-colors relative p-0.5 focus:outline-none"
              :class="isRtl ? 'bg-primary-600' : 'bg-slate-300'">
        <div class="w-5 h-5 rounded-full bg-white shadow-md transform transition-transform"
             :class="isRtl ? 'translate-x-6' : 'translate-x-0'"></div>
      </button>
    </div>

    <!-- 4. Lenis Smooth Scroll Toggle -->
    <div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
      <div>
        <p class="text-xs font-semibold">Smooth Scroll (Lenis)</p>
        <p class="text-[11px] text-slate-400">Momentum-based scrolling</p>
      </div>
      <button type="button" 
              @click="toggleSmoothScroll()" 
              aria-label="Toggle Smooth Scrolling"
              class="w-12 h-6 rounded-full transition-colors relative p-0.5 focus:outline-none"
              :class="lenis ? 'bg-primary-600' : 'bg-slate-300'">
        <div class="w-5 h-5 rounded-full bg-white shadow-md transform transition-transform"
             :class="lenis ? 'translate-x-6' : 'translate-x-0'"></div>
      </button>
    </div>

    <!-- Quick Links -->
    <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 grid grid-cols-2 gap-2 text-center text-xs font-semibold">
      <a href="{{root}}docs/index.html" class="p-2 rounded-xl bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 text-slate-700 dark:text-slate-300">Docs</a>
      <a href="{{root}}docs/components.html" class="p-2 rounded-xl bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 text-slate-700 dark:text-slate-300">Components</a>
    </div>

  </div>
</div>
