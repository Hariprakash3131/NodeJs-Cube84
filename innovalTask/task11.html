<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Timetable</title>
</head>
<body>

    <table border="1" cellpadding="10" cellspacing="0">
        <caption><strong>Weekly Class Timetable</strong></caption>

        <thead>
            <tr>
                <th scope="col">Day</th>
                <th scope="col">Period 1</th>
                <th scope="col">Period 2</th>
                <th scope="col">Lunch Break</th>
                <th scope="col">Period 3</th>
                <th scope="col">Period 4</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th scope="row">Monday</th>
                <td>HTML</td>
                <td>CSS</td>
                <td rowspan="5">Lunch Break</td>
                <td>JavaScript</td>
                <td>Python</td>
            </tr>

            <tr>
                <th scope="row">Tuesday</th>
                <td>Maths</td>
                <td>English</td>
                <td>Java</td>
                <td>Lab</td>
            </tr>

            <tr>
                <th scope="row">Wednesday</th>
                <td>Database</td>
                <td>HTML Lab</td>
                <td>CSS Lab</td>
                <td>Sports</td>
            </tr>

            <tr>
                <th scope="row">Thursday</th>
                <td>Python</td>
                <td>JavaScript</td>
                <td>React</td>
                <td>Project</td>
            </tr>

            <tr>
                <th scope="row">Friday</th>
                <td>AI Basics</td>
                <td>Communication</td>
                <td>Seminar</td>
                <td>Library</td>
            </tr>
        </tbody>

    </table>

</body>
</html>
