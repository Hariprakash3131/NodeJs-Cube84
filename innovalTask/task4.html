<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Image Attributes</title>
</head>
<body>

    <h1>Explore Image Attributes</h1>

    <!-- Change loading="lazy" to loading="eager" and observe the difference -->
    <a href="https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg">
        <img
            src="https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg"
                                                                                            alt="Beautiful Mountain Landscape"
            width="500"
            height="300"
            loading="lazy"
            crossorigin="anonymous"
            ismap>
    </a>

    <p>
        <a href="https://en.wikipedia.org/wiki/Mountain">
            View detailed description of the image
        </a>
    </p>

</body>
</html>
